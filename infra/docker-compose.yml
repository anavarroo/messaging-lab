name: messaging-lab

services:
  rabbitmq:
    image: rabbitmq:4.4-management
    # El nombre del nodo de RabbitMQ depende del hostname. Fijarlo permite que los datos del volumen
    # se reutilicen al recrear el contenedor (por ejemplo, tras "down" y "up").
    hostname: rabbitmq
    ports:
      # Solo accesibles desde la máquina local. Puertos configurables en infra/.env;
      # dentro del contenedor son siempre el 5672 (AMQP) y el 15672 (gestión y consola web).
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      # Credenciales públicas de RabbitMQ por defecto, solo válidas en local (el servicio no sale de esta máquina)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    # Arranca RabbitMQ con el trazado activado, que alimenta el visualizador de flujo (ver el propio guion).
    entrypoint: ["/usr/local/bin/enable-trace.sh"]
    volumes:
      # Conserva exchanges, colas, bindings y mensajes. "down -v" lo elimina.
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enable-trace.sh:/usr/local/bin/enable-trace.sh:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ../backend
    ports:
      # Puerto publicado en la máquina (configurable en infra/.env); dentro del contenedor es siempre el 8080
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Dentro de la red de Compose el backend usa siempre los puertos internos de RabbitMQ;
      # RABBITMQ_PORT y RABBITMQ_MANAGEMENT_PORT de infra/.env solo cambian los puertos publicados en tu máquina.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_MANAGEMENT_PORT: "15672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Cada cuánto envía el backend un latido por el flujo de eventos de los consumidores
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-15s}
      # Intermediario de Docker para parar y levantar RabbitMQ y el asistente desde «Estado» (ver "docker-proxy")
      CONTROL_DOCKER_URL: http://docker-proxy:2375
    networks:
      - default
      - control
    # Solo garantiza que el nombre "rabbitmq" exista. No espera a que RabbitMQ esté sano: el backend debe
    # arrancar aunque RabbitMQ tarde, y conectarse cuando esté listo.
    depends_on:
      rabbitmq:
        condition: service_started

  # Intermediario de Docker: lo único que deja hacer es listar contenedores, arrancarlos y pararlos. No publica
  # ningún puerto y está en una red interna que solo comparte con el backend; el backend nunca ve el socket de
  # Docker, y además solo actúa sobre RabbitMQ y el asistente de este proyecto.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Sus reglas: solo listar contenedores, arrancarlos y pararlos (ver el propio archivo)
      - ./docker-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      - control

  frontend:
    build: ../frontend
    ports:
      # Puerto publicado en la máquina (configurable en infra/.env); dentro del contenedor es siempre el 80
      - "${FRONTEND_PORT:-4200}:80"
    # Garantiza que el nombre "backend" exista cuando arranca nginx. No espera a que el backend
    # esté listo: si la interfaz carga antes, muestra el error y permite reintentar.
    depends_on:
      - backend

  # ---- Asistente de IA (especificación 07) ----
  # Servicio aparte en Python que responde en /api/assistant (nginx se lo envía). Solo lee datos del backend y
  # habla con el modelo de Ollama. Con OLLAMA_REPLICAS=0 no se levanta; con un Ollama instalado fuera de Docker,
  # pon OLLAMA_REPLICAS=0, ASSISTANT_REPLICAS=1 y ASSISTANT_OLLAMA_URL=http://host.docker.internal:11434.
  assistant:
    build: ../assistant
    deploy:
      replicas: ${ASSISTANT_REPLICAS:-${OLLAMA_REPLICAS:-1}}
    environment:
      ASSISTANT_OLLAMA_URL: ${ASSISTANT_OLLAMA_URL:-http://ollama:11434}
      ASSISTANT_BACKEND_URL: http://backend:8080
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen2.5:3b}
      ASSISTANT_EMBEDDING_MODEL: ${ASSISTANT_EMBEDDING_MODEL:-bge-m3}
      ASSISTANT_CONTEXT_TOKENS: ${ASSISTANT_CONTEXT_TOKENS:-4096}
      ASSISTANT_MAX_RESPONSE_TOKENS: ${ASSISTANT_MAX_RESPONSE_TOKENS:-700}
      ASSISTANT_TEMPERATURE: ${ASSISTANT_TEMPERATURE:-0.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # La documentación en la que busca (solo lectura), con las mismas rutas que en el repositorio
      - ../README.md:/docs/README.md:ro
      - ../specs:/docs/specs:ro
      - ../frontend/src/app/features/rabbitmq/guide/guide-content.ts:/docs/frontend/src/app/features/rabbitmq/guide/guide-content.ts:ro
      # El índice de la documentación: solo se recalcula si la documentación o el modelo cambian
      - assistant-index:/data/index
    depends_on:
      - backend


  # Modelo de lenguaje local, sin claves y sin que salga ningún dato de tu máquina. Para NO levantarlo (ocupa
  # varios GB de disco y, mientras responde, de memoria), pon OLLAMA_REPLICAS=0 en infra/.env o delante del comando:
  #   OLLAMA_REPLICAS=0 docker compose -f infra/docker-compose.yml up -d --build
  # Sin él, todo lo demás funciona igual y el asistente se muestra como no disponible.
  ollama:
    image: ollama/ollama:0.40.13
    deploy:
      replicas: ${OLLAMA_REPLICAS:-1}
    ports:
      # Solo accesible desde la máquina local
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      # Descarga el modelo de la memoria tras este tiempo sin preguntas
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      # Una sola petición a la vez, y el modelo de chat y el de embeddings cargados a la vez (unos 3,5 GB)
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      # Conserva los modelos descargados. "down -v" los elimina.
      - ollama-data:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Descarga los dos modelos (chat y embeddings) la primera vez y termina. Si ya están en el volumen, no hace nada.
  ollama-model:
    image: ollama/ollama:0.40.13
    deploy:
      replicas: ${OLLAMA_REPLICAS:-1}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen2.5:3b}
      ASSISTANT_EMBEDDING_MODEL: ${ASSISTANT_EMBEDDING_MODEL:-bge-m3}
    entrypoint: ["sh", "-c", 'for model in "$$ASSISTANT_MODEL" "$$ASSISTANT_EMBEDDING_MODEL"; do ollama list | grep -q "^$$model[ :]" || ollama pull "$$model" || exit 1; done']
    restart: "no"

networks:
  # Red interna (sin salida) entre el backend y el intermediario de Docker
  control:
    internal: true

volumes:
  rabbitmq-data:
  ollama-data:
  assistant-index:
