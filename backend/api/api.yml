openapi: 3.0.3
info:
  title: messaging-lab API
  description: API REST del backend de messaging-lab.
  version: 0.1.0
servers:
  - url: /
tags:
  - name: Status
    description: Estado del backend.
  - name: RabbitMqConnection
    description: Conexión del backend con RabbitMQ.
  - name: RabbitMqExchanges
    description: Exchanges de RabbitMQ.
  - name: RabbitMqQueues
    description: Colas de RabbitMQ.
  - name: RabbitMqBindings
    description: Bindings entre exchanges y colas de RabbitMQ.
  - name: RabbitMqFlow
    description: Visualizador de flujo de mensajes de RabbitMQ.
  - name: Lab
    description: Foto, diagnóstico y actividad del laboratorio, de solo lectura (los usa el servicio del asistente de IA).
  - name: Control
    description: >-
      Parar y levantar RabbitMQ y el asistente de IA. Solo funciona con el Docker Compose del proyecto, a través de
      un intermediario que solo permite listar, arrancar y parar contenedores.
  - name: RabbitMqQueueMessages
    description: Inspección y vaciado de los mensajes de una cola.
  - name: RabbitMqSessionEvents
    description: Flujo de eventos en tiempo real de una sesión (una pestaña del navegador).
  - name: RabbitMqConsumers
    description: Consumidores interactivos de una sesión y resolución de sus mensajes.
  - name: RabbitMqGenerator
    description: Generador de tráfico, con emisores y consumidores simulados que corren en el backend.
  - name: RabbitMqPublications
    description: Publicación de mensajes en RabbitMQ.
paths:
  /api/status:
    get:
      tags:
        - Status
      operationId: getStatus
      summary: Consulta el estado del backend
      description: Devuelve el estado del backend, el nombre de la aplicación y su versión.
      responses:
        '200':
          description: El backend está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/rabbitmq/status:
    get:
      tags:
        - RabbitMqConnection
      operationId: getRabbitMqStatus
      summary: Consulta si el backend puede comunicarse con RabbitMQ
      description: Devuelve CONNECTED y la versión de RabbitMQ cuando el backend puede comunicarse con él.
      responses:
        '200':
          description: El backend puede comunicarse con RabbitMQ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RabbitMqStatusResponse'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/exchanges:
    get:
      tags:
        - RabbitMqExchanges
      operationId: listExchanges
      summary: Lista los exchanges
      description: >-
        Devuelve los exchanges de tipo direct, fanout y topic que existen en RabbitMQ. Los predefinidos
        (el exchange por defecto y los que empiezan por «amq.») se marcan y no se pueden eliminar.
      responses:
        '200':
          description: Exchanges existentes, primero los creados por el usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exchange'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
    post:
      tags:
        - RabbitMqExchanges
      operationId: createExchange
      summary: Crea un exchange
      description: >-
        Crea un exchange durable. Si ya existe uno idéntico no lo duplica y lo indica con created=false;
        si existe con otro tipo, responde con un conflicto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExchangeRequest'
      responses:
        '200':
          description: Ya existía un exchange idéntico; no se ha duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeCreationResponse'
        '201':
          description: Exchange creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeCreationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
    delete:
      tags:
        - RabbitMqExchanges
      operationId: deleteExchange
      summary: Elimina un exchange
      description: Elimina el exchange y todos sus bindings. No se pueden eliminar los exchanges predefinidos.
      parameters:
        - name: name
          in: query
          required: true
          description: Nombre del exchange. Va como parámetro de consulta porque puede contener caracteres como «/».
          schema:
            type: string
      responses:
        '204':
          description: Exchange eliminado.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/queues:
    get:
      tags:
        - RabbitMqQueues
      operationId: listQueues
      summary: Lista las colas con sus contadores
      description: >-
        Devuelve las colas que existen en RabbitMQ, con su dead-letter queue si la tienen y el número de
        mensajes listos, pendientes de confirmar y totales.
      responses:
        '200':
          description: Colas existentes, ordenadas por nombre.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Queue'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
    post:
      tags:
        - RabbitMqQueues
      operationId: createQueue
      summary: Crea una cola
      description: >-
        Crea una cola durable, con una dead-letter queue opcional elegida entre las colas existentes. Si ya
        existe una idéntica no la duplica y lo indica con created=false; si existe con otra configuración,
        responde con un conflicto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQueueRequest'
      responses:
        '200':
          description: Ya existía una cola idéntica; no se ha duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCreationResponse'
        '201':
          description: Cola creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCreationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
    delete:
      tags:
        - RabbitMqQueues
      operationId: deleteQueue
      summary: Elimina una cola
      description: >-
        Elimina la cola con sus mensajes y sus bindings. Si es la dead-letter queue de otras colas, estas
        siguen existiendo y los mensajes que rechacen sin reencolar se descartarán.
      parameters:
        - name: name
          in: query
          required: true
          description: Nombre de la cola. Va como parámetro de consulta porque puede contener caracteres como «/».
          schema:
            type: string
      responses:
        '204':
          description: Cola eliminada.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/bindings:
    get:
      tags:
        - RabbitMqBindings
      operationId: listBindings
      summary: Lista los bindings
      description: >-
        Devuelve los bindings creados por el usuario, opcionalmente filtrados por exchange y por cola.
        No incluye los implícitos del exchange por defecto.
      parameters:
        - name: exchange
          in: query
          required: false
          description: Si se indica, solo los bindings de este exchange.
          schema:
            type: string
        - name: queue
          in: query
          required: false
          description: Si se indica, solo los bindings hacia esta cola.
          schema:
            type: string
      responses:
        '200':
          description: Bindings existentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Binding'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
    post:
      tags:
        - RabbitMqBindings
      operationId: createBinding
      summary: Crea un binding
      description: >-
        Enlaza un exchange con una cola. Si ya existe uno idéntico no lo duplica y lo indica con
        created=false. En un exchange fanout la routing key se ignora. No se admiten bindings sobre el
        exchange por defecto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBindingRequest'
      responses:
        '200':
          description: Ya existía un binding idéntico; no se ha duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingCreationResponse'
        '201':
          description: Binding creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingCreationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
    delete:
      tags:
        - RabbitMqBindings
      operationId: deleteBinding
      summary: Elimina un binding
      description: >-
        Elimina el binding indicado sin afectar a los mensajes que ya están en la cola. No se admiten
        bindings sobre el exchange por defecto.
      parameters:
        - name: exchange
          in: query
          required: true
          description: Nombre del exchange de origen.
          schema:
            type: string
        - name: queue
          in: query
          required: true
          description: Nombre de la cola de destino.
          schema:
            type: string
        - name: routingKey
          in: query
          required: false
          description: Routing key o patrón del binding. Si se omite, es la vacía.
          schema:
            type: string
      responses:
        '204':
          description: Binding eliminado.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/publications:
    post:
      tags:
        - RabbitMqPublications
      operationId: publishMessage
      summary: Publica un mensaje en un exchange
      description: >-
        Publica un mensaje de texto, de forma persistente, y espera la confirmación de RabbitMQ. Responde
        200 con routed=false si RabbitMQ lo ha aceptado pero ninguna cola lo ha recibido porque ningún
        binding coincide; en ese caso el mensaje se ha descartado. Con el exchange por defecto (nombre vacío)
        la routing key es el nombre de la cola de destino.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: RabbitMQ ha aceptado el mensaje.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/queues/messages:
    get:
      tags:
        - RabbitMqQueueMessages
      operationId: inspectQueue
      summary: Inspecciona los mensajes de una cola
      description: >-
        Devuelve los primeros 50 mensajes listos de la cola, en su orden, sin retirarlos. No incluye los
        pendientes de confirmar por un consumidor. RabbitMQ no ofrece una lectura sin efecto, así que la
        inspección puede dejar los mensajes marcados como reentregados.
      parameters:
        - name: queue
          in: query
          required: true
          description: Nombre de la cola.
          schema:
            type: string
      responses:
        '200':
          description: Mensajes listos de la cola.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueInspection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
    delete:
      tags:
        - RabbitMqQueueMessages
      operationId: purgeQueue
      summary: Vacía una cola
      description: >-
        Elimina los mensajes listos de la cola, manteniendo la cola y sus bindings. No afecta a los mensajes
        pendientes de confirmar por un consumidor.
      parameters:
        - name: queue
          in: query
          required: true
          description: Nombre de la cola.
          schema:
            type: string
      responses:
        '204':
          description: Cola vaciada.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/session/events:
    get:
      tags:
        - RabbitMqSessionEvents
      operationId: openSessionEvents
      summary: Abre el flujo de eventos de una sesión
      description: >-
        Abre un flujo de eventos (Server-Sent Events) que identifica una sesión, normalmente una pestaña del
        navegador. Los consumidores que se inicien en la sesión entregan sus mensajes por este flujo. Al
        cerrarse el flujo, la sesión termina y se detienen sus consumidores, devolviendo a la cola los
        mensajes pendientes de confirmar. Eventos: session-started (SessionStartedEvent), consumer-started
        (ConsumerStartedEvent), message-received (MessageReceivedEvent) y consumer-stopped
        (ConsumerStoppedEvent). Cada 15 segundos se envía un comentario de latido. No hay reconexión
        automática: una sesión nueva no conserva los consumidores de la anterior.
      responses:
        '200':
          description: Flujo de eventos abierto.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ConsumerEventStream'
  /api/rabbitmq/sessions/{sessionId}/consumers:
    post:
      tags:
        - RabbitMqConsumers
      operationId: createConsumer
      summary: Inicia un consumidor en una sesión
      description: >-
        Empieza a consumir una cola. En modo MANUAL el consumidor retiene como máximo un mensaje pendiente
        de confirmar. Los mensajes se entregan por el flujo de eventos de la sesión.
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identificador de la sesión, recibido en el evento session-started.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsumerRequest'
      responses:
        '201':
          description: Consumidor iniciado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/sessions/{sessionId}/consumers/{consumerId}:
    delete:
      tags:
        - RabbitMqConsumers
      operationId: deleteConsumer
      summary: Detiene un consumidor
      description: Detiene el consumidor y devuelve a la cola sus mensajes pendientes de confirmar.
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identificador de la sesión, recibido en el evento session-started.
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          description: Identificador del consumidor.
          schema:
            type: string
      responses:
        '204':
          description: Consumidor detenido.
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/sessions/{sessionId}/consumers/{consumerId}/messages/{deliveryTag}:
    post:
      tags:
        - RabbitMqConsumers
      operationId: resolveMessage
      summary: Resuelve un mensaje pendiente de confirmar
      description: >-
        Confirma el mensaje, lo rechaza y reencola, o lo rechaza sin reencolar. Un mensaje solo se puede
        resolver una vez. Si se rechaza sin reencolar, el resultado indica si fue a la dead-letter queue
        o se descartó.
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Identificador de la sesión, recibido en el evento session-started.
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          description: Identificador del consumidor.
          schema:
            type: string
        - name: deliveryTag
          in: path
          required: true
          description: Identificador del mensaje recibido en el evento message-received.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveMessageRequest'
      responses:
        '200':
          description: Mensaje resuelto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveMessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/generator/emitters:
    get:
      tags:
        - RabbitMqGenerator
      operationId: listEmitters
      summary: Lista los emisores simulados
      description: >-
        Devuelve todos los emisores con su estado real y sus contadores.
      responses:
        '200':
          description: Emisores existentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Emitter'
    post:
      tags:
        - RabbitMqGenerator
      operationId: createEmitter
      summary: Crea un emisor simulado
      description: >-
        Crea un emisor parado. Se inicia con la acción START.
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmitterRequest'
      responses:
        '201':
          description: Emisor creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Emitter'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/rabbitmq/generator/emitters/{id}:
    put:
      tags:
        - RabbitMqGenerator
      operationId: updateEmitter
      summary: Edita un emisor parado
      description: >-
        Solo se puede editar un emisor que esté parado.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador.
          schema:
            type: string
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmitterRequest'
      responses:
        '200':
          description: Emisor editado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Emitter'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      tags:
        - RabbitMqGenerator
      operationId: deleteEmitter
      summary: Elimina un emisor
      description: >-
        Lo para si estaba en marcha y lo elimina.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador.
          schema:
            type: string
      responses:
        '204':
          description: Emisor eliminado.
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/rabbitmq/generator/emitters/{id}/actions:
    post:
      tags:
        - RabbitMqGenerator
      operationId: actOnEmitter
      summary: Inicia, pausa, reanuda o para un emisor
      description: >-
        Iniciar y reanudar comprueban el límite global de mensajes por segundo y que el destino exista.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador.
          schema:
            type: string
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratorActionRequest'
      responses:
        '200':
          description: Emisor en su nuevo estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Emitter'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/generator/templates:
    get:
      tags:
        - RabbitMqGenerator
      operationId: listTemplates
      summary: Lista las plantillas predefinidas
      description: >-
        Plantillas industriales listas para usar: brazo robótico, temperatura, sonómetro, vibración, tag de PLC y alarma.
      responses:
        '200':
          description: Plantillas disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplatePreset'
  /api/rabbitmq/generator/templates/preview:
    post:
      tags:
        - RabbitMqGenerator
      operationId: previewTemplate
      summary: Genera un ejemplo de una plantilla
      description: >-
        Genera un cuerpo de ejemplo sin enviar nada. Rechaza las plantillas inválidas explicando qué falla y dónde.
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePreviewRequest'
      responses:
        '200':
          description: Ejemplo generado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePreviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/rabbitmq/generator/settings:
    get:
      tags:
        - RabbitMqGenerator
      operationId: getGeneratorSettings
      summary: Lee los ajustes del generador
      description: >-
        Devuelve el límite global de mensajes por segundo y cuánto se está usando.
      responses:
        '200':
          description: Ajustes actuales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratorSettings'
    put:
      tags:
        - RabbitMqGenerator
      operationId: updateGeneratorSettings
      summary: Cambia el límite global
      description: >-
        No puede ser menor que lo que ya está en marcha ni superar el máximo absoluto.
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratorSettingsRequest'
      responses:
        '200':
          description: Ajustes actualizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratorSettings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/rabbitmq/generator/consumers:
    get:
      tags:
        - RabbitMqGenerator
      operationId: listSimulatedConsumers
      summary: Lista los consumidores simulados
      description: >-
        Devuelve todos con su estado real y sus contadores.
      responses:
        '200':
          description: Consumidores simulados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimulatedConsumer'
    post:
      tags:
        - RabbitMqGenerator
      operationId: createSimulatedConsumer
      summary: Crea un consumidor simulado
      description: >-
        Lo crea parado. Se inicia con la acción START.
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatedConsumerRequest'
      responses:
        '201':
          description: Consumidor creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatedConsumer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/rabbitmq/generator/consumers/{id}:
    delete:
      tags:
        - RabbitMqGenerator
      operationId: deleteSimulatedConsumer
      summary: Elimina un consumidor simulado
      description: >-
        Lo para si estaba en marcha y lo elimina.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador.
          schema:
            type: string
      responses:
        '204':
          description: Consumidor eliminado.
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/rabbitmq/generator/consumers/{id}/actions:
    post:
      tags:
        - RabbitMqGenerator
      operationId: actOnSimulatedConsumer
      summary: Inicia o para un consumidor simulado
      description: >-
        Las acciones válidas son START y STOP.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador.
          schema:
            type: string
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratorActionRequest'
      responses:
        '200':
          description: Consumidor en su nuevo estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatedConsumer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '502':
          $ref: '#/components/responses/BrokerRejectedError'
        '503':
          $ref: '#/components/responses/BrokerUnavailableError'
        '504':
          $ref: '#/components/responses/BrokerTimeoutError'
  /api/rabbitmq/generator/stop-all:
    post:
      tags:
        - RabbitMqGenerator
      operationId: stopAllGenerators
      summary: Para todos los emisores y consumidores simulados
      description: >-
        Detiene todo lo que esté en marcha.
      responses:
        '200':
          description: Todo detenido.
  /api/rabbitmq/flow/status:
    get:
      tags:
        - RabbitMqFlow
      operationId: getFlowStatus
      summary: Estado de la fuente de datos del visualizador de flujo
      description: >-
        Indica si el trazado de RabbitMQ (firehose) está activo. Si no lo está, el campo hint explica cómo
        activarlo.
      responses:
        '200':
          description: Estado de la fuente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowSourceStatus'
  /api/rabbitmq/flow/topology:
    get:
      tags:
        - RabbitMqFlow
      operationId: getFlowTopology
      summary: Topología que dibuja el visualizador
      description: >-
        Nodos (publicadores, exchanges, colas y consumidores) y las conexiones entre ellos. Los
        publicadores y consumidores son los observados en el trazado.
      responses:
        '200':
          description: Topología actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTopology'
  /api/rabbitmq/flow/events:
    get:
      tags:
        - RabbitMqFlow
      operationId: listFlowEvents
      summary: Últimos eventos de flujo
      description: Los últimos eventos conservados en memoria (hasta 1000), el más reciente primero.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Eventos recientes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/rabbitmq/flow/stream:
    get:
      tags:
        - RabbitMqFlow
      operationId: openFlowStream
      summary: Flujo de eventos en tiempo real
      description: >-
        Abre un flujo text/event-stream mientras la pantalla del visualizador está abierta. Eventos:
        status (FlowSourceStatus, al conectar y cuando cambia), topology (FlowTopology, al conectar y cuando
        cambia), tick (FlowTick; al conectar se reenvían los de los últimos 2 minutos y después uno por
        segundo) y flow-event (FlowEvent, como máximo 50 por segundo; los omitidos se cuentan en el tick).
        Cada 15 segundos se envía un comentario de latido.
      responses:
        '200':
          description: Flujo abierto.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/FlowEventStream'
  /api/control/services:
    get:
      tags:
        - Control
      operationId: getControlledServices
      summary: Servicios que se pueden parar y levantar
      description: >-
        Indica si el control está disponible (solo con el Docker Compose del proyecto) y, para RabbitMQ y el
        asistente de IA, si están en marcha, parados o no existen (por ejemplo, el asistente con OLLAMA_REPLICAS=0).
      responses:
        '200':
          description: Estado del control y de cada servicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlStatus'
  /api/control/services/{service}/actions:
    post:
      tags:
        - Control
      operationId: actOnService
      summary: Para o levanta un servicio
      description: >-
        Solo admite rabbitmq y assistant (este, junto con su Ollama), y solo sobre los contenedores de este proyecto
        Compose. Responde cuando Docker ha terminado de arrancar o parar el contenedor; el servicio puede tardar
        unos segundos más en estar listo.
      parameters:
        - name: service
          in: path
          required: true
          description: rabbitmq o assistant.
          schema:
            type: string
            example: rabbitmq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlActionRequest'
      responses:
        '200':
          description: Servicio en su nuevo estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledService'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          description: El control no está disponible (sin Docker Compose) o Docker ha fallado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/lab/snapshot:
    get:
      tags:
        - Lab
      operationId: getLabSnapshot
      summary: Foto del laboratorio
      description: >-
        Estado actual del laboratorio, ya resumido: RabbitMQ y su trazado, colas con mensajes, consumidores y ritmos reales,
        exchanges con sus colas enlazadas, emisores y consumidores simulados, y el límite global. Solo lectura; no incluye
        cuerpos de mensajes. La usan las herramientas del asistente de IA.
      responses:
        '200':
          description: Foto actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSnapshot'
  /api/lab/diagnostics:
    get:
      tags:
        - Lab
      operationId: getLabDiagnostics
      summary: Problemas detectados en el laboratorio
      description: >-
        Conclusiones de las reglas de diagnóstico sobre el estado real (colas que crecen, colas sin consumidor,
        dead-letter queues con mensajes, emisores fallados, mensajes sin enrutar, trazado desactivado, RabbitMQ caído…),
        de más a menos graves, cada una como frase completa de causa y solución en español. Solo lectura; no incluye
        cuerpos de mensajes.
      responses:
        '200':
          description: Diagnóstico actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabDiagnostics'
  /api/lab/activity:
    get:
      tags:
        - Lab
      operationId: getLabActivity
      summary: Lo que se mueve ahora en el laboratorio
      description: >-
        Si ahora mismo pasan mensajes (emisores y consumidores simulados en marcha, colas con entradas o salidas), con una
        descripción en español lista para mostrar. Solo lectura.
      responses:
        '200':
          description: Actividad actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabActivity'
components:
  responses:
    ValidationError:
      description: Los datos enviados no son válidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFoundError:
      description: El elemento indicado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ConflictError:
      description: La operación choca con el estado actual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BrokerRejectedError:
      description: RabbitMQ ha rechazado la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BrokerUnavailableError:
      description: RabbitMQ no está disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BrokerTimeoutError:
      description: RabbitMQ no ha respondido dentro del tiempo máximo de espera.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      description: Error de una operación, con un mensaje en español dirigido al usuario.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Tipo de error.
          enum:
            - VALIDATION
            - NOT_FOUND
            - CONFLICT
            - BROKER_UNAVAILABLE
            - TIMEOUT
            - BROKER_REJECTED
            - CONTROL_UNAVAILABLE
          example: BROKER_UNAVAILABLE
        message:
          type: string
          description: Explicación del error en español, sin detalles técnicos internos.
          example: RabbitMQ no está disponible.
    StatusResponse:
      type: object
      description: Estado, nombre y versión del backend.
      required:
        - status
        - name
        - version
      properties:
        status:
          type: string
          description: Estado del backend.
          enum:
            - AVAILABLE
          example: AVAILABLE
        name:
          type: string
          description: Nombre de la aplicación.
          example: messaging-lab-backend
        version:
          type: string
          description: Versión del backend.
          example: 0.1.0
    RabbitMqStatusResponse:
      type: object
      description: Estado de la conexión del backend con RabbitMQ.
      required:
        - status
        - version
      properties:
        status:
          type: string
          description: CONNECTED cuando el backend puede comunicarse con RabbitMQ.
          enum:
            - CONNECTED
          example: CONNECTED
        version:
          type: string
          description: Versión de RabbitMQ.
          example: 4.4.0
    ExchangeType:
      type: string
      description: Tipo de exchange.
      enum:
        - DIRECT
        - FANOUT
        - TOPIC
    Exchange:
      type: object
      description: Exchange de RabbitMQ.
      required:
        - name
        - type
        - predefined
      properties:
        name:
          type: string
          description: Nombre del exchange. El exchange por defecto tiene el nombre vacío.
          example: pedidos
        type:
          $ref: '#/components/schemas/ExchangeType'
        predefined:
          type: boolean
          description: Es uno de los que trae RabbitMQ; no se puede modificar ni eliminar.
    CreateExchangeRequest:
      type: object
      description: Datos para crear un exchange.
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: Nombre del exchange. Hasta 255 caracteres, sin caracteres de control y sin el prefijo «amq.».
          example: pedidos
        type:
          $ref: '#/components/schemas/ExchangeType'
    ExchangeCreationResponse:
      type: object
      description: Resultado de crear un exchange.
      required:
        - exchange
        - created
      properties:
        exchange:
          $ref: '#/components/schemas/Exchange'
        created:
          type: boolean
          description: Falso si ya existía un exchange idéntico y no se ha duplicado.
    Queue:
      type: object
      description: Cola de RabbitMQ con sus contadores.
      required:
        - name
        - ready
        - unacknowledged
        - total
      properties:
        name:
          type: string
          description: Nombre de la cola.
          example: pedidos-nuevos
        deadLetterQueue:
          type: string
          nullable: true
          description: Cola a la que van los mensajes rechazados sin reencolar. Nulo si no tiene.
          example: pedidos-fallidos
        ready:
          type: integer
          format: int64
          description: Mensajes listos para entregar.
        unacknowledged:
          type: integer
          format: int64
          description: Mensajes entregados a un consumidor y pendientes de confirmar.
        total:
          type: integer
          format: int64
          description: Mensajes listos más pendientes de confirmar.
    CreateQueueRequest:
      type: object
      description: Datos para crear una cola.
      required:
        - name
      properties:
        name:
          type: string
          description: Nombre de la cola. Hasta 255 caracteres, sin caracteres de control y sin el prefijo «amq.».
          example: pedidos-nuevos
        deadLetterQueue:
          type: string
          nullable: true
          description: Nombre de una cola existente que recibirá los mensajes rechazados sin reencolar. No puede ser la propia cola.
          example: pedidos-fallidos
    QueueCreationResponse:
      type: object
      description: Resultado de crear una cola.
      required:
        - queue
        - created
      properties:
        queue:
          $ref: '#/components/schemas/Queue'
        created:
          type: boolean
          description: Falso si ya existía una cola idéntica y no se ha duplicado.
    Binding:
      type: object
      description: Enlace entre un exchange y una cola.
      required:
        - exchange
        - queue
        - routingKey
      properties:
        exchange:
          type: string
          description: Nombre del exchange de origen.
          example: pedidos
        queue:
          type: string
          description: Nombre de la cola de destino.
          example: pedidos-nuevos
        routingKey:
          type: string
          description: Routing key o patrón. Vacía si el exchange es fanout o se dejó vacía.
          example: pedido.creado
    CreateBindingRequest:
      type: object
      description: Datos para crear un binding.
      required:
        - exchange
        - queue
      properties:
        exchange:
          type: string
          description: Nombre del exchange de origen. No puede ser el exchange por defecto.
          example: pedidos
        queue:
          type: string
          description: Nombre de la cola de destino.
          example: pedidos-nuevos
        routingKey:
          type: string
          nullable: true
          description: >-
            Routing key (direct) o patrón (topic) de hasta 255 caracteres. Opcional y vacía por defecto;
            se ignora en un exchange fanout.
          example: pedido.*
    BindingCreationResponse:
      type: object
      description: Resultado de crear un binding.
      required:
        - binding
        - created
      properties:
        binding:
          $ref: '#/components/schemas/Binding'
        created:
          type: boolean
          description: Falso si ya existía un binding idéntico y no se ha duplicado.
    PublishRequest:
      type: object
      description: Mensaje de texto que se quiere publicar.
      required:
        - exchange
        - body
      properties:
        exchange:
          type: string
          description: >-
            Nombre del exchange. Vacío para el exchange por defecto, que entrega a la cola cuyo nombre es
            la routing key.
          example: pedidos
        routingKey:
          type: string
          nullable: true
          description: Routing key de hasta 255 caracteres. Opcional y vacía por defecto; un fanout la ignora.
          example: pedido.creado
        body:
          type: string
          description: Cuerpo del mensaje. No puede estar vacío ni superar los 65536 bytes en UTF-8.
          example: '{"id": 42}'
    PublishResponse:
      type: object
      description: Resultado de una publicación aceptada por RabbitMQ.
      required:
        - routed
      properties:
        routed:
          type: boolean
          description: Falso si ninguna cola ha recibido el mensaje porque ningún binding coincide; se ha descartado.
    DeathInfo:
      type: object
      description: Por qué un mensaje de una dead-letter queue llegó hasta ella.
      required:
        - originQueue
        - reason
      properties:
        originQueue:
          type: string
          description: Cola de la que salió el mensaje.
          example: pedidos-nuevos
        reason:
          type: string
          description: Motivo, tal como lo informa RabbitMQ; por ejemplo «rejected».
          example: rejected
    QueueMessage:
      type: object
      description: Mensaje de una cola.
      required:
        - body
        - exchange
        - routingKey
        - redelivered
      properties:
        body:
          type: string
          description: Cuerpo del mensaje como texto. Si no es texto UTF-8 válido se indica que es binario y se muestra en base64.
        exchange:
          type: string
          description: Exchange por el que llegó; en una dead-letter queue, el original. Vacío si es el exchange por defecto.
        routingKey:
          type: string
          description: Routing key con la que llegó; en una dead-letter queue, la original.
        redelivered:
          type: boolean
          description: Marcado como reentregado. La propia inspección puede marcarlo.
        deathInfo:
          allOf:
            - $ref: '#/components/schemas/DeathInfo'
          nullable: true
          description: Solo en mensajes de una dead-letter queue, cuando RabbitMQ lo proporciona.
    QueueInspection:
      type: object
      description: Resultado de inspeccionar una cola.
      required:
        - messages
        - total
        - truncated
      properties:
        messages:
          type: array
          description: Hasta 50 mensajes listos, en el orden de la cola.
          items:
            $ref: '#/components/schemas/QueueMessage'
        total:
          type: integer
          format: int64
          description: Mensajes listos que tiene la cola.
        truncated:
          type: boolean
          description: Hay más mensajes listos de los que se muestran.
    AckMode:
      type: string
      description: Cómo confirma los mensajes un consumidor.
      enum:
        - AUTOMATIC
        - MANUAL
    MessageAction:
      type: string
      description: Qué hacer con un mensaje pendiente de confirmar.
      enum:
        - ACK
        - REQUEUE
        - REJECT
    ActionOutcome:
      type: string
      description: >-
        Qué ha pasado finalmente con el mensaje. DEAD_LETTERED si pasó a la dead-letter queue de la cola,
        DISCARDED si se rechazó sin reencolar en una cola sin dead-letter queue.
      enum:
        - CONFIRMED
        - REQUEUED
        - DEAD_LETTERED
        - DISCARDED
    StopReason:
      type: string
      description: Por qué ha terminado un consumidor.
      enum:
        - USER
        - QUEUE_DELETED
        - CONNECTION_LOST
        - SESSION_CLOSED
    CreateConsumerRequest:
      type: object
      description: Datos para iniciar un consumidor.
      required:
        - name
        - queue
        - ackMode
      properties:
        name:
          type: string
          description: Nombre del consumidor, único en la sesión. Hasta 255 caracteres.
          example: consumidor-1
        queue:
          type: string
          description: Nombre de la cola que consume.
          example: pedidos-nuevos
        ackMode:
          $ref: '#/components/schemas/AckMode'
    Consumer:
      type: object
      description: Consumidor activo de una sesión.
      required:
        - id
        - name
        - queue
        - ackMode
      properties:
        id:
          type: string
          description: Identificador del consumidor.
        name:
          type: string
          description: Nombre del consumidor.
        queue:
          type: string
          description: Cola que consume.
        ackMode:
          $ref: '#/components/schemas/AckMode'
    ResolveMessageRequest:
      type: object
      description: Acción que se aplica a un mensaje.
      required:
        - action
      properties:
        action:
          $ref: '#/components/schemas/MessageAction'
    ResolveMessageResponse:
      type: object
      description: Resultado de resolver un mensaje.
      required:
        - outcome
      properties:
        outcome:
          $ref: '#/components/schemas/ActionOutcome'
    ConsumerEventStream:
      type: string
      description: >-
        Flujo de eventos text/event-stream. El generador lo sustituye por SseEmitter (schemaMappings); los
        eventos concretos son SessionStartedEvent, ConsumerStartedEvent, MessageReceivedEvent y
        ConsumerStoppedEvent.
    SessionStartedEvent:
      type: object
      description: Primer evento del flujo (nombre de evento session-started).
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          description: Identificador de la sesión, necesario para iniciar consumidores.
    ConsumerStartedEvent:
      type: object
      description: Un consumidor ha empezado a consumir (nombre de evento consumer-started).
      required:
        - consumer
      properties:
        consumer:
          $ref: '#/components/schemas/Consumer'
    MessageReceivedEvent:
      type: object
      description: Un consumidor ha recibido un mensaje (nombre de evento message-received).
      required:
        - consumerId
        - deliveryTag
        - message
      properties:
        consumerId:
          type: string
          description: Consumidor que lo ha recibido.
        deliveryTag:
          type: integer
          format: int64
          description: Identificador del mensaje para resolverlo en modo MANUAL.
        message:
          $ref: '#/components/schemas/QueueMessage'
    ConsumerStoppedEvent:
      type: object
      description: Un consumidor ha terminado (nombre de evento consumer-stopped).
      required:
        - consumerId
        - reason
        - message
      properties:
        consumerId:
          type: string
          description: Consumidor que ha terminado.
        reason:
          $ref: '#/components/schemas/StopReason'
        message:
          type: string
          description: Explicación en español dirigida al usuario.
    GeneratorActionRequest:
      type: object
      description: Acción sobre un emisor o un consumidor simulado.
      required:
        - action
      properties:
        action:
          type: string
          description: START, PAUSE, RESUME o STOP (los consumidores simulados solo admiten START y STOP).
          enum:
            - START
            - PAUSE
            - RESUME
            - STOP
    EmitterDestination:
      type: object
      description: Dónde publica un emisor. Con EXCHANGE, un exchange y su routing key; con QUEUE, directamente una cola.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - EXCHANGE
            - QUEUE
        exchange:
          type: string
          nullable: true
          description: Nombre del exchange, si el tipo es EXCHANGE.
          example: pizzeria
        routingKey:
          type: string
          nullable: true
          description: Routing key, si el tipo es EXCHANGE. Puede ser vacía.
          example: planta1.robot.ur5e01.estado
        queue:
          type: string
          nullable: true
          description: Nombre de la cola, si el tipo es QUEUE.
    Interval:
      type: object
      description: Cada cuánto ocurre algo, fijo o aleatorio dentro de un rango, en milisegundos.
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - FIXED
            - RANGE
        fixedMs:
          type: integer
          format: int64
          nullable: true
          description: Intervalo fijo, si el modo es FIXED. Mínimo 2 ms.
          example: 500
        minMs:
          type: integer
          format: int64
          nullable: true
          description: Mínimo del rango, si el modo es RANGE.
          example: 200
        maxMs:
          type: integer
          format: int64
          nullable: true
          description: Máximo del rango, si el modo es RANGE.
          example: 800
    EmitterRequest:
      type: object
      description: Datos para crear o editar un emisor simulado.
      required:
        - name
        - destination
        - interval
        - template
      properties:
        name:
          type: string
          description: Nombre del emisor, único. Hasta 255 caracteres.
          example: robot-ur5e-01
        destination:
          $ref: '#/components/schemas/EmitterDestination'
        interval:
          $ref: '#/components/schemas/Interval'
        template:
          type: string
          description: Plantilla del cuerpo, con valores entre dobles llaves como {{numero(20,30)}}. No ejecuta código.
        maxMessages:
          type: integer
          format: int64
          nullable: true
          description: Si se indica, el emisor se para solo tras publicar este número de mensajes.
        maxDurationSeconds:
          type: integer
          format: int64
          nullable: true
          description: Si se indica, el emisor se para solo tras estos segundos en marcha.
        onlyWhenChanged:
          type: boolean
          description: Si es true, no se publica un mensaje cuyo cuerpo sea igual al anterior (como un tag de PLC que solo emite al cambiar).
    Emitter:
      type: object
      description: Emisor simulado con su estado real y sus contadores.
      required:
        - id
        - name
        - destination
        - interval
        - template
        - onlyWhenChanged
        - status
        - published
        - unrouted
        - ratePerSecond
      properties:
        id:
          type: string
        name:
          type: string
        destination:
          $ref: '#/components/schemas/EmitterDestination'
        interval:
          $ref: '#/components/schemas/Interval'
        template:
          type: string
        maxMessages:
          type: integer
          format: int64
          nullable: true
        maxDurationSeconds:
          type: integer
          format: int64
          nullable: true
        onlyWhenChanged:
          type: boolean
        status:
          type: string
          description: STOPPED (parado), RUNNING (en marcha), PAUSED (en pausa), FINISHED (terminó por su límite) o FAILED (se paró por un error).
          enum:
            - STOPPED
            - RUNNING
            - PAUSED
            - FINISHED
            - FAILED
        published:
          type: integer
          format: int64
          description: Mensajes publicados.
        unrouted:
          type: integer
          format: int64
          description: Mensajes que RabbitMQ aceptó pero no llegaron a ninguna cola.
        ratePerSecond:
          type: number
          format: double
          description: Ritmo real, en mensajes por segundo, medido sobre los últimos segundos.
        stopMessage:
          type: string
          nullable: true
          description: Por qué se ha parado, en español, si se paró por sí solo.
    TemplatePreset:
      type: object
      description: Plantilla predefinida para empezar rápido; sus valores se pueden ajustar.
      required:
        - id
        - name
        - description
        - template
        - suggestedInterval
        - suggestedRoutingKey
        - onlyWhenChanged
      properties:
        id:
          type: string
          example: robot-ur
        name:
          type: string
          example: Brazo robótico
        description:
          type: string
        template:
          type: string
        suggestedInterval:
          $ref: '#/components/schemas/Interval'
        suggestedRoutingKey:
          type: string
        onlyWhenChanged:
          type: boolean
    TemplatePreviewRequest:
      type: object
      required:
        - template
      properties:
        template:
          type: string
    TemplatePreviewResponse:
      type: object
      required:
        - body
        - bytes
      properties:
        body:
          type: string
          description: Un cuerpo de ejemplo generado con la plantilla.
        bytes:
          type: integer
          description: Tamaño del cuerpo en bytes (UTF-8).
    GeneratorSettings:
      type: object
      description: Ajustes del generador y uso actual.
      required:
        - maxRatePerSecond
        - absoluteMaxRatePerSecond
        - ratePerSecondInUse
        - maxEmitters
        - maxSimulatedConsumers
      properties:
        maxRatePerSecond:
          type: integer
          description: Límite global de mensajes por segundo, sumando todos los emisores en marcha.
          example: 100
        absoluteMaxRatePerSecond:
          type: integer
          description: Máximo al que se puede subir el límite.
          example: 500
        ratePerSecondInUse:
          type: number
          format: double
          description: Suma de las frecuencias de los emisores en marcha.
        maxEmitters:
          type: integer
          example: 20
        maxSimulatedConsumers:
          type: integer
          example: 20
    GeneratorSettingsRequest:
      type: object
      required:
        - maxRatePerSecond
      properties:
        maxRatePerSecond:
          type: integer
          description: Nuevo límite global, entre 1 y el máximo absoluto.
    SimulatedConsumerRequest:
      type: object
      description: Datos para crear un consumidor simulado.
      required:
        - name
        - queue
        - processing
        - failurePercent
        - onFailure
      properties:
        name:
          type: string
          description: Nombre del consumidor simulado, único.
          example: procesador-cocina
        queue:
          type: string
          description: Cola que consume.
        processing:
          $ref: '#/components/schemas/Interval'
        failurePercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Porcentaje de mensajes que fallan.
        onFailure:
          type: string
          description: REQUEUE (rechazar y reencolar) o REJECT (rechazar sin reencolar, a la dead-letter queue si la cola la tiene).
          enum:
            - REQUEUE
            - REJECT
    SimulatedConsumer:
      type: object
      description: Consumidor simulado con su estado real y sus contadores.
      required:
        - id
        - name
        - queue
        - processing
        - failurePercent
        - onFailure
        - status
        - processed
        - failed
        - ratePerSecond
      properties:
        id:
          type: string
        name:
          type: string
        queue:
          type: string
        processing:
          $ref: '#/components/schemas/Interval'
        failurePercent:
          type: integer
        onFailure:
          type: string
          enum:
            - REQUEUE
            - REJECT
        status:
          type: string
          description: STOPPED, RUNNING o FAILED (se paró por un error, por ejemplo porque se eliminó la cola).
          enum:
            - STOPPED
            - RUNNING
            - FAILED
        processed:
          type: integer
          format: int64
          description: Mensajes confirmados.
        failed:
          type: integer
          format: int64
          description: Mensajes que han fallado y se han rechazado.
        ratePerSecond:
          type: number
          format: double
        stopMessage:
          type: string
          nullable: true
    FlowSourceStatus:
      type: object
      description: Estado de la fuente de datos del visualizador.
      required:
        - state
      properties:
        state:
          type: string
          description: UNAVAILABLE (el sistema no responde), DISABLED (el trazado está desactivado) o ACTIVE.
          enum:
            - UNAVAILABLE
            - DISABLED
            - ACTIVE
        hint:
          type: string
          nullable: true
          description: Qué hacer para activar la fuente, en español.
    FlowNode:
      type: object
      description: >-
        Elemento del diagrama. Es genérico; en RabbitMQ el enrutador es un exchange y el destino una cola.
      required:
        - id
        - kind
        - label
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - PRODUCER
            - ROUTER
            - DESTINATION
            - CONSUMER
        label:
          type: string
        detail:
          type: string
          nullable: true
          description: Dato adicional del nodo, por ejemplo el tipo de exchange.
    FlowEdge:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
        to:
          type: string
        label:
          type: string
          nullable: true
          description: Por ejemplo, el patrón de un binding.
    FlowTopology:
      type: object
      required:
        - nodes
        - edges
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/FlowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/FlowEdge'
    FlowEvent:
      type: object
      description: Un mensaje publicado o entregado, tal como lo ve el trazado.
      required:
        - id
        - time
        - type
        - destinations
        - sizeBytes
        - redelivered
        - unrouted
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - PUBLISH
            - DELIVER
        producer:
          type: string
          nullable: true
          description: Id del nodo publicador, si se conoce.
        router:
          type: string
          nullable: true
          description: Id del nodo enrutador (exchange) por el que pasó.
        destinations:
          type: array
          description: Ids de los destinos (colas) a los que RabbitMQ enrutó la publicación, o de la cola de la que sale la entrega.
          items:
            type: string
        consumer:
          type: string
          nullable: true
          description: Id del nodo consumidor, en las entregas.
        key:
          type: string
          description: Routing key.
        sizeBytes:
          type: integer
          format: int64
        redelivered:
          type: boolean
        unrouted:
          type: boolean
          description: Publicación que no llegó a ninguna cola.
        body:
          type: string
          description: Cuerpo, truncado a 4 KB. Es texto no fiable.
        bodyTruncated:
          type: boolean
        properties:
          type: object
          additionalProperties: true
          description: Propiedades y cabeceras del mensaje.
    FlowTick:
      type: object
      description: Resumen de un segundo.
      required:
        - time
        - published
        - delivered
        - ready
        - omitted
      properties:
        time:
          type: string
          format: date-time
        published:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Mensajes por segundo publicados, por id de nodo.
        delivered:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Mensajes por segundo entregados, por id de nodo.
        ready:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Mensajes listos, por id de destino.
        omitted:
          type: integer
          format: int64
          description: Eventos que no se enviaron en este segundo por superar el máximo de 50.
    FlowEventStream:
      type: string
      description: >-
        Flujo de eventos text/event-stream. El generador lo sustituye por SseEmitter (schemaMappings); los
        eventos concretos son status, topology, tick y flow-event.
    LabFinding:
      type: object
      required:
        - severity
        - topic
        - text
      properties:
        severity:
          type: string
          enum:
            - CRITICAL
            - WARNING
            - INFO
        topic:
          type: string
          description: De qué trata (STATE, QUEUES, EXCHANGES, EMITTERS, CONSUMERS, FLOW o TRACE).
        text:
          type: string
          description: Frase completa de causa y, si la hay, de solución, en español.
    LabDiagnostics:
      type: object
      required:
        - brokerAvailable
        - findings
      properties:
        brokerAvailable:
          type: boolean
        findings:
          type: array
          description: De más a menos graves; vacía si no hay nada que revisar.
          items:
            $ref: '#/components/schemas/LabFinding'
    LabActivity:
      type: object
      required:
        - active
        - text
      properties:
        active:
          type: boolean
          description: Si ahora mismo pasan mensajes.
        text:
          type: string
          description: Descripción en español lista para mostrar.
    LabSnapshot:
      type: object
      required:
        - time
        - broker
        - trace
        - queues
        - exchanges
        - emitters
        - consumers
        - load
      properties:
        time:
          type: string
          format: date-time
        broker:
          type: object
          required:
            - available
          properties:
            available:
              type: boolean
            version:
              type: string
              nullable: true
            reason:
              type: string
              nullable: true
        trace:
          type: object
          required:
            - state
          properties:
            state:
              type: string
              enum:
                - ACTIVE
                - DISABLED
                - UNKNOWN
            hint:
              type: string
              nullable: true
        queues:
          type: array
          items:
            type: object
            required:
              - name
              - ready
              - unacknowledged
              - consumers
            properties:
              name:
                type: string
              ready:
                type: integer
                format: int64
              unacknowledged:
                type: integer
                format: int64
              deadLetterQueue:
                type: string
                nullable: true
              consumers:
                type: integer
                description: Consumidores leyendo de la cola; -1 si no se sabe.
              inPerSecond:
                type: number
                format: double
                nullable: true
                description: Mensajes que entran por segundo; ausente si no se sabe.
              outPerSecond:
                type: number
                format: double
                nullable: true
        exchanges:
          type: array
          items:
            type: object
            required:
              - name
              - type
              - boundQueues
            properties:
              name:
                type: string
              type:
                type: string
              boundQueues:
                type: array
                items:
                  type: string
        emitters:
          type: array
          items:
            type: object
            required:
              - name
              - status
              - destination
              - ratePerSecond
              - published
              - unrouted
            properties:
              name:
                type: string
              status:
                type: string
              destination:
                type: string
              ratePerSecond:
                type: number
                format: double
              published:
                type: integer
                format: int64
              unrouted:
                type: integer
                format: int64
              stopMessage:
                type: string
                nullable: true
        consumers:
          type: array
          items:
            type: object
            required:
              - name
              - queue
              - status
              - ratePerSecond
              - processed
              - failed
            properties:
              name:
                type: string
              queue:
                type: string
              status:
                type: string
              ratePerSecond:
                type: number
                format: double
              processed:
                type: integer
                format: int64
              failed:
                type: integer
                format: int64
              stopMessage:
                type: string
                nullable: true
        load:
          type: object
          required:
            - ratePerSecondInUse
            - maxRatePerSecond
            - omittedPerSecond
          properties:
            ratePerSecondInUse:
              type: number
              format: double
            maxRatePerSecond:
              type: integer
            omittedPerSecond:
              type: integer
              format: int64
    ControlStatus:
      type: object
      required:
        - available
        - services
      properties:
        available:
          type: boolean
          description: Si se pueden parar y levantar servicios desde aquí.
        reason:
          type: string
          nullable: true
          description: Por qué no está disponible, en español, con el comando equivalente.
        services:
          type: array
          description: RabbitMQ y el asistente; vacía si el control no está disponible.
          items:
            $ref: '#/components/schemas/ControlledService'
    ControlledService:
      type: object
      required:
        - service
        - state
      properties:
        service:
          type: string
          enum:
            - RABBITMQ
            - ASSISTANT
        state:
          type: string
          description: RUNNING (en marcha), STOPPED (parado) o MISSING (no existe en este proyecto).
          enum:
            - RUNNING
            - STOPPED
            - MISSING
        message:
          type: string
          nullable: true
          description: Explicación en español cuando no existe, con el comando para crearlo.
    ControlActionRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - START
            - STOP
