spring.application.name=messaging-lab
server.port=${BACKEND_PORT:8080}
# Configuración local opcional (puertos) compartida con el frontend y Docker Compose
spring.config.import=optional:file:../infra/.env[.properties]

# RabbitMQ. Los valores por defecto (guest/guest) son las credenciales públicas de RabbitMQ y solo valen
# para el desarrollo local, porque el servicio solo es accesible desde esta máquina.
messaginglab.rabbitmq.host=${RABBITMQ_HOST:localhost}
messaginglab.rabbitmq.port=${RABBITMQ_PORT:5672}
messaginglab.rabbitmq.management-port=${RABBITMQ_MANAGEMENT_PORT:15672}
messaginglab.rabbitmq.username=${RABBITMQ_USER:guest}
messaginglab.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
messaginglab.rabbitmq.virtual-host=/

# Cada cuánto se envía un latido por el flujo de eventos de una sesión (ver RabbitMqSessionEventsController).
# Es también lo que tarda el servidor en darse cuenta de que se ha cerrado una pestaña y devolver a la cola los
# mensajes que tenía pendientes de confirmar: un valor menor lo acelera.
messaginglab.session.heartbeat-interval=${HEARTBEAT_INTERVAL:15s}

# Intermediario de Docker para parar y levantar RabbitMQ y el asistente desde «Estado». Solo lo configura el
# Docker Compose; vacío (arranque por componentes) el control no está disponible.
messaginglab.control.docker-url=${CONTROL_DOCKER_URL:}
