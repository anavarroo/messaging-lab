server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. El backend se resuelve en cada petición (no solo al arrancar),
    # de modo que nginx arranca aunque el backend todavía no esté listo y no se queda
    # con una IP obsoleta si el backend se recrea. Mientras no responda, devuelve 502.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;
    set $assistant http://assistant:8000;

    # Flujo de eventos (SSE) de la sesión de consumidores. Sin búfer ni caché, para que cada evento y cada
    # latido lleguen al navegador en cuanto el backend los envía; y con un tiempo de lectura largo, porque la
    # conexión permanece abierta mientras la pestaña esté abierta. Esta ruta exacta tiene prioridad sobre /api/.
    location = /api/rabbitmq/session/events {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Asistente de IA: un servicio aparte (especificación 07). Su respuesta llega por un flujo de eventos, así que
    # va sin búfer y con un tiempo de lectura largo. Si no está levantado (por ejemplo, con OLLAMA_REPLICAS=0),
    # se responde como lo haría él, para que la interfaz diga que el asistente no está y no que falla el backend.
    location = /api/assistant/status {
        proxy_pass $assistant;
        proxy_intercept_errors on;
        error_page 502 503 504 = @assistant_status_down;
    }

    location /api/assistant/ {
        proxy_pass $assistant;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 5m;
        proxy_intercept_errors on;
        error_page 502 504 = @assistant_down;
    }

    location @assistant_status_down {
        default_type application/json;
        return 200 '{"state":"UNAVAILABLE","message":"El asistente de IA no está en marcha. Si lo has parado, levántalo desde la tarjeta del asistente en «Estado»; si se ha arrancado con OLLAMA_REPLICAS=0, no se puede usar."}';
    }

    location @assistant_down {
        default_type application/json;
        return 503 '{"code":"ASSISTANT_UNAVAILABLE","message":"El asistente de IA no está en marcha. Si lo has parado, levántalo desde la tarjeta del asistente en «Estado»; si se ha arrancado con OLLAMA_REPLICAS=0, no se puede usar."}';
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El index.html no se cachea para que una nueva versión se vea al recargar
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas de Angular: cualquier dirección que no sea un archivo devuelve index.html
    location / {
        try_files $uri /index.html;
    }
}
