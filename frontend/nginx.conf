server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. El backend se resuelve en cada petición (no solo al arrancar),
    # de modo que nginx arranca aunque el backend todavía no esté listo y no se queda
    # con una IP obsoleta si el backend se recrea. Mientras no responda, devuelve 502.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El index.html no se cachea para que una nueva versión se vea al recargar
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas de Angular: cualquier dirección que no sea un archivo devuelve index.html
    location / {
        try_files $uri /index.html;
    }
}
