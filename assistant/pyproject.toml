[project]
name = "messaging-lab-assistant"
version = "0.1.0"
description = "Asistente de IA del laboratorio de mensajería: solo lee datos del backend."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "ollama==0.6.3",
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["evaluation: evaluación contra el stack levantado (no se ejecuta por defecto)"]
addopts = "-m 'not evaluation'"
