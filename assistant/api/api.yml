openapi: 3.0.3
info:
  title: messaging-lab assistant API
  description: >-
    API del servicio del asistente de IA (especificación 07). Es la misma que tenía el backend en la especificación 06,
    así que el frontend no cambia. nginx y el proxy de desarrollo le envían /api/assistant.
  version: 0.1.0
servers:
  - url: /
tags:
  - name: Assistant
    description: Asistente de IA local del laboratorio. Solo lee datos del backend.
paths:
  /api/assistant/status:
    get:
      tags:
        - Assistant
      operationId: getAssistantStatus
      summary: Estado del modelo del asistente
      description: >-
        Indica si el modelo de IA local está listo para responder, si se está preparando (la primera vez se descarga)
        o si no está disponible, con el motivo en español. Que el asistente no esté disponible no afecta al resto de
        la aplicación.
      responses:
        '200':
          description: Estado del asistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantStatus'
  /api/assistant/chat:
    post:
      tags:
        - Assistant
      operationId: chatWithAssistant
      summary: Pregunta al asistente
      description: >-
        Responde a una pregunta sobre el laboratorio usando el estado actual de la aplicación. La respuesta llega por
        un flujo text/event-stream con los eventos token (AssistantToken, un trozo de la respuesta), done (fin) y
        error (AssistantError, si el modelo falla a mitad de la respuesta). El asistente es de solo lectura. Si el
        cliente cierra la conexión, la generación se cancela. Solo atiende una pregunta a la vez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantChatRequest'
      responses:
        '200':
          description: Respuesta en curso.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AssistantEventStream'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          description: El asistente no está disponible o se está preparando.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  responses:
    ValidationError:
      description: Los datos enviados no son válidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ConflictError:
      description: El asistente ya está respondiendo a otra pregunta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      description: Error de una operación, con un mensaje en español dirigido al usuario.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - VALIDATION
            - CONFLICT
            - ASSISTANT_UNAVAILABLE
        message:
          type: string
    AssistantStatus:
      type: object
      description: Estado del modelo del asistente.
      required:
        - state
      properties:
        state:
          type: string
          description: READY (puede responder), PREPARING (se está descargando o cargando el modelo) o UNAVAILABLE.
          enum:
            - READY
            - PREPARING
            - UNAVAILABLE
        message:
          type: string
          nullable: true
          description: Explicación en español cuando no está listo.
    AssistantTurn:
      type: object
      description: Una intervención anterior de la conversación.
      required:
        - role
        - text
      properties:
        role:
          type: string
          enum:
            - USER
            - ASSISTANT
        text:
          type: string
          maxLength: 2000
    AssistantChatRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          description: La pregunta, de hasta 500 caracteres.
        history:
          type: array
          maxItems: 8
          description: Las últimas intervenciones de la conversación; el servidor se queda con las que caben en el contexto.
          items:
            $ref: '#/components/schemas/AssistantTurn'
    AssistantToken:
      type: object
      description: Un trozo de la respuesta (nombre de evento token).
      required:
        - text
      properties:
        text:
          type: string
    AssistantError:
      type: object
      description: El modelo falló a mitad de la respuesta (nombre de evento error).
      required:
        - message
      properties:
        message:
          type: string
    AssistantEventStream:
      type: string
      description: >-
        Flujo de eventos text/event-stream con los eventos token (AssistantToken), done (objeto vacío) y error
        (AssistantError).
